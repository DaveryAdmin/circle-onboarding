version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: circle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-circle_onboarding}
      POSTGRES_USER:     ${POSTGRES_USER:-circle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circle} -d ${POSTGRES_DB:-circle_onboarding}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: circle_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:       production
      PORT:           4000
      DATABASE_URL:   postgres://${POSTGRES_USER:-circle}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-circle_onboarding}
      SSO_JWT_SECRET: ${SSO_JWT_SECRET}
      SSO_AUDIENCE:   ${SSO_AUDIENCE}
      SSO_ISSUER:     ${SSO_ISSUER}
      CORS_ORIGIN:    ${CORS_ORIGIN:-http://localhost}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: circle_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data: