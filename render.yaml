services:
  - type: pserv
    name: circle-postgres
    plan: starter
    databaseName: circle_onboarding
    databaseUser: circle
    ipAllowList: []

  - type: web
    name: circle-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: circle-postgres
          property: connectionString
      - key: SSO_JWT_SECRET
        value: REPLACE_IN_RENDER_DASHBOARD
      - key: SSO_AUDIENCE
        value: circle-onboarding
      - key: SSO_ISSUER
        value: https://your-sso-provider.example.com
      - key: CORS_ORIGIN
        value: https://circle-web.onrender.com

  - type: web
    name: circle-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    branch: main
    plan: starter
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://circle-api.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://circle-api.onrender.com/api